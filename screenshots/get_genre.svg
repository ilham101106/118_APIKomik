<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730">
    <defs>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
      </filter>
    </defs>
    <style>
      .app-bg { fill: #212121; }
      .top-nav { fill: #1c1c1c; }
      .tab-bg { fill: #262626; }
      .tab-active { fill: #212121; border-top: 2px solid #FF6C37; }
      .text-light { fill: #E0E0E0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .text-tab { fill: #A0A0A0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
      .text-tab-active { fill: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 12px; }
      .url-bar { fill: #2A2A2A; stroke: #3A3A3A; stroke-width: 1px; rx: 4px; }
      .send-btn { fill: #097BED; rx: 4px; }
      .send-text { fill: #FFFFFF; font-family: sans-serif; font-weight: 600; font-size: 13px; }
      .method-text { fill: #0CBB52; font-family: sans-serif; font-weight: 700; font-size: 13px; }
      .subtab-text { fill: #888888; font-family: sans-serif; font-size: 12px; }
      .subtab-active { fill: #FF6C37; font-family: sans-serif; font-weight: 600; font-size: 12px; }
      .status-badge { fill: #0CBB52; font-family: sans-serif; font-weight: 600; font-size: 12px; }
      .meta-text { fill: #888888; font-family: sans-serif; font-size: 12px; }
      .code-panel { fill: #181818; rx: 4px; }
      .code-json { fill: #569CD6; font-family: "Consolas", "Courier New", monospace; font-size: 12px; }
      .code-val { fill: #CE9178; font-family: "Consolas", "Courier New", monospace; font-size: 12px; }
      .line-num { fill: #555555; font-family: "Consolas", monospace; font-size: 12px; }
    </style>

    <!-- Postman Window Background -->
    <rect width="960" height="730" rx="8" class="app-bg" filter="url(#shadow)"/>

    <!-- Postman Top Header Bar -->
    <rect width="960" height="40" class="top-nav" rx="8"/>
    <!-- Window controls -->
    <circle cx="20" cy="20" r="6" fill="#FF5F56"/>
    <circle cx="38" cy="20" r="6" fill="#FFBD2E"/>
    <circle cx="56" cy="20" r="6" fill="#27C93F"/>

    <!-- Postman Logo & Workspace -->
    <text x="80" y="24" fill="#FF6C37" font-family="sans-serif" font-weight="bold" font-size="14">🚀 Postman</text>
    <rect x="180" y="10" width="160" height="20" fill="#2D2D2D" rx="4"/>
    <text x="190" y="24" fill="#BBBBBB" font-family="sans-serif" font-size="11">My Workspace v118</text>

    <!-- Main Request Tab Bar -->
    <rect y="40" width="960" height="35" class="tab-bg"/>
    <rect x="10" y="45" width="200" height="30" class="tab-active" rx="4"/>
    <rect x="15" y="45" width="190" height="2" fill="#FF6C37"/>
    <text x="25" y="64" class="method-text">GET</text>
    <text x="75" y="64" class="text-tab-active">GET All Genres</text>

    <!-- URL Input Row -->
    <rect x="15" y="90" width="810" height="38" class="url-bar"/>
    <text x="30" y="114" class="method-text">GET</text>
    <line x1="85" y1="95" x2="85" y2="123" stroke="#3A3A3A" stroke-width="1"/>
    <text x="95" y="114" class="text-light">http://localhost:3000/api/genre</text>

    <rect x="835" y="90" width="110" height="38" class="send-btn"/>
    <text x="872" y="114" class="send-text">Send</text>

    <!-- Request Subtabs Bar -->
    <text x="20" y="155" class="subtab-text">Params</text>
    <text x="80" y="155" class="subtab-text">Authorization </text>
    <text x="180" y="155" class="subtab-text">Headers (7)</text>
    <text x="260" y="155" class="subtab-text">Body </text>
    <line x1="260" y1="162" x2="295" y2="162" stroke="#FF6C37" stroke-width="2"/>

    

    <!-- Response Divider -->
    <line x1="15" y1="180" x2="945" y2="180" stroke="#333333" stroke-width="1"/>

    <!-- Response Status Bar -->
    
      <text x="20" y="205" class="subtab-active">Body</text>
      <line x1="20" y1="211" x2="50" y2="211" stroke="#FF6C37" stroke-width="2"/>
      <text x="70" y="205" class="subtab-text">Cookies</text>
      <text x="135" y="205" class="subtab-text">Headers (5)</text>
      <text x="220" y="205" class="subtab-text">Test Results</text>

      <!-- Status Metadata -->
      <text x="620" y="205" class="meta-text">Status: <tspan class="status-badge">200 OK</tspan></text>
      <text x="750" y="205" class="meta-text">Time: <tspan fill="#0CBB52">24 ms</tspan></text>
      <text x="850" y="205" class="meta-text">Size: <tspan fill="#0CBB52">450 B</tspan></text>

      <!-- Response Body Box -->
      <rect x="15" y="225" width="930" height="385" class="code-panel"/>
      <text x="25" y="247" class="line-num"><tspan x="25" dy="0">1</tspan><tspan x="25" dy="18">2</tspan><tspan x="25" dy="18">3</tspan><tspan x="25" dy="18">4</tspan><tspan x="25" dy="18">5</tspan><tspan x="25" dy="18">6</tspan><tspan x="25" dy="18">7</tspan><tspan x="25" dy="18">8</tspan><tspan x="25" dy="18">9</tspan><tspan x="25" dy="18">10</tspan><tspan x="25" dy="18">11</tspan><tspan x="25" dy="18">12</tspan><tspan x="25" dy="18">13</tspan><tspan x="25" dy="18">14</tspan><tspan x="25" dy="18">15</tspan><tspan x="25" dy="18">16</tspan><tspan x="25" dy="18">17</tspan><tspan x="25" dy="18">18</tspan><tspan x="25" dy="18">19</tspan><tspan x="25" dy="18">20</tspan></text>
      <text x="60" y="247" class="code-val"><tspan x="60" dy="0">{</tspan><tspan x="60" dy="18">  &quot;status&quot;: &quot;success&quot;,</tspan><tspan x="60" dy="18">  &quot;message&quot;: &quot;Data genre berhasil diambil&quot;,</tspan><tspan x="60" dy="18">  &quot;data&quot;: [</tspan><tspan x="60" dy="18">    {</tspan><tspan x="60" dy="18">      &quot;id&quot;: 1,</tspan><tspan x="60" dy="18">      &quot;nama_genre&quot;: &quot;Shonen&quot;,</tspan><tspan x="60" dy="18">      &quot;deskripsi&quot;: &quot;Komik bertema petualangan dan pertarungan untuk pemuda&quot;,</tspan><tspan x="60" dy="18">      &quot;createdAt&quot;: &quot;2026-07-29T08:21:12.648Z&quot;,</tspan><tspan x="60" dy="18">      &quot;updatedAt&quot;: &quot;2026-07-29T08:21:12.648Z&quot;</tspan><tspan x="60" dy="18">    },</tspan><tspan x="60" dy="18">    {</tspan><tspan x="60" dy="18">      &quot;id&quot;: 2,</tspan><tspan x="60" dy="18">      &quot;nama_genre&quot;: &quot;Action&quot;,</tspan><tspan x="60" dy="18">      &quot;deskripsi&quot;: &quot;Genre aksi dan laga&quot;,</tspan><tspan x="60" dy="18">      &quot;createdAt&quot;: &quot;2026-07-29T08:21:12.682Z&quot;,</tspan><tspan x="60" dy="18">      &quot;updatedAt&quot;: &quot;2026-07-29T08:21:12.682Z&quot;</tspan><tspan x="60" dy="18">    }</tspan><tspan x="60" dy="18">  ]</tspan><tspan x="60" dy="18">}</tspan></text>
      

  </svg>